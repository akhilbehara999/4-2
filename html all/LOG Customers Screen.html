<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LOG Customers Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Telugu:wght@400;500;700&display=swap">
<style>
/* Layout: Android (Material 3) list screen for every customer, including those who owe nothing. Back + title bar, count line, search, filter chips, alphabetical list, extended Add customer button, bottom sheet to add or edit. */
:root{
  --bg:#E4EAE9; --surface:#F9FBFB; --container:#EDF2F1; --fg:#141E1C; --muted:#5C6D69; --line:#DAE3E1; --outline:#8A9B97;
  --accent:#0B6E5F; --accent-tonal:#D3ECE6; --on-accent:#FFFFFF; --red:#B3261E; --good:#2E7D32; --orange:#B85A00;
  --inv:#2B3532; --on-inv:#F1F6F4; --scrim:rgba(0,0,0,.4);
  --f:'Roboto','Noto Sans Telugu',system-ui,sans-serif; --te:'Noto Sans Telugu','Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C0B; --surface:#0E1715; --container:#16221F; --fg:#E3EDEA; --muted:#93A6A1; --line:#26352F; --outline:#5F746E;
  --accent:#4FD1B8; --accent-tonal:#15403A; --on-accent:#04201A; --red:#FFB4AB; --good:#8FDB95; --orange:#FFB070;
  --inv:#DDE7E4; --on-inv:#141E1C; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C0B; --surface:#0E1715; --container:#16221F; --fg:#E3EDEA; --muted:#93A6A1; --line:#26352F; --outline:#5F746E;
  --accent:#4FD1B8; --accent-tonal:#15403A; --on-accent:#04201A; --red:#FFB4AB; --good:#8FDB95; --orange:#FFB070;
  --inv:#DDE7E4; --on-inv:#141E1C; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--f);padding-inline:16px;padding-block:28px;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:392px;height:820px;background:var(--surface);border-radius:32px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.sys{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 0;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.sys span:last-child{display:flex;gap:6px;align-items:center}
.top{display:flex;align-items:center;gap:4px;padding:10px 8px 4px}
.top h1{margin:0;font:500 22px/1.2 var(--f)}
.top h1 span{font:400 15px var(--te);color:var(--muted);margin-left:8px}
.ib{width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--container)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{padding:4px 16px 0}
.search{position:relative}
.search svg{position:absolute;left:16px;top:16px;color:var(--muted)}
.search input{width:100%;height:56px;border-radius:28px;border:0;background:var(--container);color:var(--fg);padding:0 20px 0 48px;font:400 16px var(--f)}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--fg);font:500 14px var(--f);cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed=true]{background:var(--accent-tonal);border-color:transparent;color:var(--accent)}
.count{padding:10px 20px 2px;font:400 13px var(--f);color:var(--muted)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 96px}
.gh{position:sticky;top:0;background:var(--surface);padding:10px 4px 4px;font:500 13px var(--f);color:var(--accent);z-index:1}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:12px}
.row:hover{background:var(--container)}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-tonal);color:var(--accent);display:grid;place-items:center;font:500 18px var(--f);flex:none}
.body{flex:1;min-width:0}
.n{font:500 16px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n span{font:400 14px var(--te);color:var(--muted);margin-left:6px}
.s{font:400 13px var(--f);color:var(--muted);font-variant-numeric:tabular-nums}
.r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.r b{display:block;font:700 16px var(--f);color:var(--orange)}
.r small{font:400 12px var(--f);color:var(--muted)}
.r .ok{font:500 13px var(--f);color:var(--good)}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
.fab{position:absolute;right:16px;bottom:116px;height:56px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font:500 16px var(--f);display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:3}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;background:var(--container);padding:10px 12px 8px}
.bar>button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font:500 12px var(--f);cursor:pointer;min-height:56px;justify-content:center}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.bar [aria-current=page]{color:var(--fg)}
.bar [aria-current=page] .pill{background:var(--accent-tonal);color:var(--accent)}
.speak{margin-top:-34px;color:var(--fg)!important}
.speak .mic{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 6px var(--container),0 6px 14px rgba(0,0,0,.25)}
.gest{background:var(--container);padding:2px 0 8px;display:flex;justify-content:center}
.gest i{width:110px;height:4px;border-radius:2px;background:var(--fg);opacity:.5}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;z-index:6;max-height:92%;overflow-y:auto;visibility:hidden}
.show .scrim{opacity:1;pointer-events:auto}
.show .sheet{transform:none;visibility:visible}
.grab{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:0 auto 14px;opacity:.6}
.sheet h3{margin:0 0 14px;font:500 20px var(--f)}
.sheet h3 span{font:400 15px var(--te);color:var(--muted);margin-left:8px}
.fld{margin-bottom:14px}
.fld label{display:block;font:500 13px var(--f);color:var(--muted);margin:0 0 6px 4px}
.in{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--outline);background:var(--surface);color:var(--fg);padding:0 16px;font:400 17px var(--te)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.in.bad{border-color:var(--red)}
.msg{font:400 13px var(--f);color:var(--red);margin:-6px 4px 12px;min-height:0}
.note{font:400 13px var(--f);color:var(--muted);margin:0 4px 14px}
.btn{height:52px;border-radius:26px;border:1px solid var(--outline);background:none;color:var(--accent);font:500 16px var(--f);cursor:pointer}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.srow{display:flex;gap:10px;margin-top:6px}.srow .btn{flex:1}.srow .btn.fill{flex:2}
.danger{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.dbtn{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:none;color:var(--red);font:500 14px var(--f);cursor:pointer}
.dbtn.yes{background:var(--red);border-color:var(--red);color:var(--surface)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 14px var(--f);color:var(--red)}
.toast{position:absolute;left:16px;right:16px;bottom:184px;background:var(--inv);color:var(--on-inv);border-radius:14px;padding:14px 16px;font:400 15px var(--f);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:440px){body{padding:0}.app{border-radius:0;border:0;height:100dvh;min-height:680px}}
</style>

<div class="app" id="app">
  <div class="sys"><span>9:41</span><span aria-hidden="true">
    <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor"><path d="M12 3C7.5 3 3.6 4.7 0.5 7.5L12 18 23.5 7.5C20.4 4.7 16.5 3 12 3z"/></svg>
    <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor"><path d="M0 18h24V0z"/></svg>
    <svg width="22" height="12" viewBox="0 0 28 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="23" height="12" rx="3"/><rect x="3" y="3" width="15" height="8" rx="1.5" fill="currentColor" stroke="none"/></svg>
  </span></div>

  <div class="top">
    <button class="ib" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <h1>Customers<span>కస్టమర్లు</span></h1>
  </div>

  <div class="tools">
    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name or phone · వెతకండి" aria-label="Search customers">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter"></div>
  </div>
  <div class="count" id="count"></div>

  <div class="scroll" id="scroll"></div>

  <button class="fab" id="fab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add customer</button>

  <nav class="bar" aria-label="Main">
    <button><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg></span>Home</button>
    <button class="speak" aria-label="Speak"><span class="mic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></span>Speak</button>
    <button aria-current="page"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>More</button>
  </nav>
  <div class="gest"><i></i></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Customer">
    <div class="grab"></div>
    <h3 id="sh">Add customer<span>కొత్త కస్టమర్</span></h3>
    <div class="fld"><label for="fN">Name</label><input class="in" id="fN" autocomplete="off" placeholder="e.g. Suresh"></div>
    <div class="msg" id="fMsg"></div>
    <div class="fld"><label for="fT">Name in Telugu · తెలుగులో పేరు</label><input class="in" id="fT" autocomplete="off" placeholder="సురేష్"></div>
    <div class="fld"><label for="fP">Phone number (optional)</label><input class="in" id="fP" inputmode="tel" autocomplete="off" placeholder="+91 98XXX XXXXX"></div>
    <p class="note">The Telugu name helps the app recognise it when you say it.</p>
    <div class="srow"><button class="btn" id="fCancel" type="button">Cancel</button><button class="btn fill" id="fSave" type="button">Save</button></div>
    <div class="danger" id="danger"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* Sample data (examples). bal = udhar balance; zero means settled. */
var C=[
 {n:'Anitha',te:'అనిత',p:'+91 98490 22110',bal:550},{n:'Kiran',te:'కిరణ్',p:'+91 99120 45873',bal:400},
 {n:'Lakshmi',te:'లక్ష్మి',p:'+91 98851 30942',bal:1850},{n:'Mahesh',te:'మహేష్',p:'+91 94400 77215',bal:0},
 {n:'Naresh',te:'నరేష్',p:'+91 97030 18864',bal:800},{n:'Padma',te:'పద్మ',p:'+91 98660 53307',bal:1400},
 {n:'Ramesh',te:'రామేష్',p:'+91 98480 12345',bal:4200},{n:'Ravi',te:'రవి',p:'',bal:0},
 {n:'Sunitha',te:'సునీత',p:'+91 96760 40128',bal:0},{n:'Suresh',te:'సురేష్',p:'+91 99890 61472',bal:950},
 {n:'Venkat Rao',te:'వెంకట్ రావు',p:'+91 98123 90561',bal:2300}];
var flt='all',q='',edit=null;
var $=function(i){return document.getElementById(i)};
function inr(v){return '₹'+v.toLocaleString('en-IN')}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}
[['all','All'],['owe','Owes money'],['clear','Settled']].forEach(function(x){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=x[1];b.setAttribute('aria-pressed',x[0]===flt);
  b.addEventListener('click',function(){flt=x[0];$('chips').querySelectorAll('.chip').forEach(function(y){y.setAttribute('aria-pressed',y===b)});render()});$('chips').appendChild(b)});
function render(){
  var s=q.toLowerCase(),r=C.filter(function(c){return (flt==='all'||(flt==='owe')===(c.bal>0))&&(!s||c.n.toLowerCase().indexOf(s)>-1||c.te.indexOf(q)>-1||c.p.replace(/\s/g,'').indexOf(s.replace(/\s/g,''))>-1)});
  r.sort(function(a,b){return a.n.localeCompare(b.n)});
  $('count').textContent=C.length+' customers · '+C.filter(function(c){return c.bal>0}).length+' owe money';
  var sc=$('scroll');sc.textContent='';if(!r.length){var e=document.createElement('div');e.className='empty';e.textContent='No customers match.';sc.appendChild(e);return}
  var cur='',ul=null;r.forEach(function(c){var L=c.n[0].toUpperCase();if(L!==cur){cur=L;var h=document.createElement('div');h.className='gh';h.textContent=L;sc.appendChild(h);ul=document.createElement('ul');ul.className='list';sc.appendChild(ul)}
    var li=document.createElement('li'),b=document.createElement('button');b.type='button';b.className='row';
    b.innerHTML='<span class="av"></span><span class="body"><div class="n"></div><div class="s"></div></span><span class="r"></span>';
    b.querySelector('.av').textContent=c.n[0];var n=b.querySelector('.n');n.textContent=c.n;var t=document.createElement('span');t.textContent=c.te;n.appendChild(t);
    b.querySelector('.s').textContent=c.p||'No phone number';
    var r2=b.querySelector('.r');if(c.bal>0){r2.innerHTML='<b></b><small>owes</small>';r2.querySelector('b').textContent=inr(c.bal)}else{r2.innerHTML='<span class="ok">Settled</span>'}
    b.addEventListener('click',function(){open(c)});li.appendChild(b);ul.appendChild(li)})}
function open(c){edit=c;$('sh').firstChild.nodeValue=c?'Edit customer':'Add customer';$('sh').querySelector('span').textContent=c?'మార్చు':'కొత్త కస్టమర్';
  $('fN').value=c?c.n:'';$('fT').value=c?c.te:'';$('fP').value=c?c.p:'';err('');dIdle();$('danger').hidden=!c;$('app').classList.add('show');$('fN').focus()}
function close(){$('app').classList.remove('show')}
function err(m){$('fMsg').textContent=m;$('fMsg').style.minHeight=m?'18px':'0';$('fN').classList.toggle('bad',!!m)}
$('fab').addEventListener('click',function(){open(null)});
$('scrim').addEventListener('click',close);$('fCancel').addEventListener('click',close);
$('fN').addEventListener('input',function(){err('')});
$('fSave').addEventListener('click',function(){var n=$('fN').value.trim();if(!n){err('Enter a name.');return}
  var dup=C.some(function(c){return c!==edit&&c.n.toLowerCase()===n.toLowerCase()});if(dup){err('A customer named '+n+' already exists.');return}
  if(edit){edit.n=n;edit.te=$('fT').value.trim();edit.p=$('fP').value.trim();toast('Customer updated · మార్చబడింది')}
  else{C.push({n:n,te:$('fT').value.trim(),p:$('fP').value.trim(),bal:0});toast(n+' added · చేర్చబడింది')}
  close();render()});
function dIdle(){var d=$('danger');d.textContent='';var b=document.createElement('button');b.type='button';b.className='dbtn';b.textContent='Delete customer';b.addEventListener('click',dAsk);d.appendChild(b)}
function dAsk(){var d=$('danger');d.textContent='';var w=document.createElement('div');w.className='confirm';w.innerHTML='<span>Delete and remove their history?</span>';
  var c=document.createElement('button');c.type='button';c.className='dbtn';c.style.color='var(--fg)';c.textContent='Cancel';c.addEventListener('click',dIdle);
  var y=document.createElement('button');y.type='button';y.className='dbtn yes';y.textContent='Delete';y.addEventListener('click',function(){C.splice(C.indexOf(edit),1);close();render();toast('Customer deleted')});
  w.appendChild(c);w.appendChild(y);d.appendChild(w)}
$('q').addEventListener('input',function(){q=this.value.trim();render()});
render();
</script>

</body></html>
