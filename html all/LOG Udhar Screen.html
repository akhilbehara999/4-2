<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LOG Udhar Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Telugu:wght@400;500;700&display=swap">
<style>
/* Layout: Android (Material 3) list screen. Back + title bar, one summary panel (total to collect), search, filter chips, customer list, shared bottom bar with More selected. */
:root{
  --bg:#E4EAE9; --surface:#F9FBFB; --container:#EDF2F1; --card:#FFFFFF; --fg:#141E1C; --muted:#5C6D69; --line:#DAE3E1;
  --accent:#0B6E5F; --accent-tonal:#D3ECE6; --on-accent:#FFFFFF; --red:#B3261E; --red-tonal:#FBE4E1; --orange:#B85A00; --orange-tonal:#FCEBD9;
  --f:'Roboto','Noto Sans Telugu',system-ui,sans-serif; --te:'Noto Sans Telugu','Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C0B; --surface:#0E1715; --container:#16221F; --card:#142019; --fg:#E3EDEA; --muted:#93A6A1; --line:#26352F;
  --accent:#4FD1B8; --accent-tonal:#15403A; --on-accent:#04201A; --red:#FFB4AB; --red-tonal:#4A1D19; --orange:#FFB070; --orange-tonal:#3A2A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C0B; --surface:#0E1715; --container:#16221F; --card:#142019; --fg:#E3EDEA; --muted:#93A6A1; --line:#26352F;
  --accent:#4FD1B8; --accent-tonal:#15403A; --on-accent:#04201A; --red:#FFB4AB; --red-tonal:#4A1D19; --orange:#FFB070; --orange-tonal:#3A2A18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--f);padding-inline:16px;padding-block:28px;display:flex;justify-content:center}
.app{width:100%;max-width:392px;background:var(--surface);border-radius:32px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.sys{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 0;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.sys span:last-child{display:flex;gap:6px;align-items:center}
.top{display:flex;align-items:center;gap:4px;padding:10px 8px 4px}
.top h1{margin:0;font:500 22px/1.2 var(--f)}
.top h1 span{font:400 15px var(--te);color:var(--muted);margin-left:8px}
.ib{width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--container)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:6px 16px 8px}
.sum{background:var(--orange-tonal);border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sum .lab{font:500 13px var(--f);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sum .lab span{text-transform:none;letter-spacing:0;font-family:var(--te);margin-left:6px}
.total{font:700 36px/1.1 var(--f);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--fg)}
.sub{display:flex;gap:20px;font-size:14px;color:var(--muted)}
.sub b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.sub .od b{color:var(--red)}
.search{position:relative;margin-top:14px}
.search svg{position:absolute;left:16px;top:16px;color:var(--muted)}
.search input{width:100%;height:56px;border-radius:28px;border:0;background:var(--container);color:var(--fg);padding:0 20px 0 48px;font:400 16px var(--f)}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{height:36px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--fg);font:500 14px var(--f);cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed=true]{background:var(--accent-tonal);border-color:transparent;color:var(--accent)}
.sort{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--muted)}
.list{list-style:none;margin:6px 0 0;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:12px}
.row:last-child{border:0}
.row:hover{background:var(--container)}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent-tonal);color:var(--accent);display:grid;place-items:center;font:500 18px var(--f);flex:none}
.row.od .av{background:var(--red-tonal);color:var(--red)}
.body{flex:1;min-width:0}
.n{font:500 16px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n span{font:400 14px var(--te);color:var(--muted);margin-left:6px}
.s{font-size:13px;color:var(--muted);margin-top:1px}
.row.od .s{color:var(--red);font-weight:500}
.amt{font:700 17px var(--f);font-variant-numeric:tabular-nums;flex:none}
.empty{padding:28px 0;text-align:center;color:var(--muted);font-size:14px}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;background:var(--container);padding:10px 12px 8px;margin-top:10px}
.bar>button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font:500 12px var(--f);cursor:pointer;min-height:56px;justify-content:center}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.bar [aria-current=page]{color:var(--fg)}
.bar [aria-current=page] .pill{background:var(--accent-tonal);color:var(--accent)}
.speak{margin-top:-34px;color:var(--fg)!important}
.speak .mic{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 6px var(--container),0 6px 14px rgba(0,0,0,.25)}
.gest{background:var(--container);padding:2px 0 8px;display:flex;justify-content:center}
.gest i{width:110px;height:4px;border-radius:2px;background:var(--fg);opacity:.5}
@media (max-width:440px){body{padding:0}.app{border-radius:0;border:0}}
</style>

<div class="app">
  <div class="sys"><span>9:41</span><span aria-hidden="true">
    <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor"><path d="M12 3C7.5 3 3.6 4.7 0.5 7.5L12 18 23.5 7.5C20.4 4.7 16.5 3 12 3z"/></svg>
    <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor"><path d="M0 18h24V0z"/></svg>
    <svg width="22" height="12" viewBox="0 0 28 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="23" height="12" rx="3"/><rect x="3" y="3" width="15" height="8" rx="1.5" fill="currentColor" stroke="none"/></svg>
  </span></div>

  <div class="top">
    <button class="ib" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <h1>Udhar<span>ఉధార్</span></h1>
  </div>

  <main>
    <section class="sum" aria-label="Total to collect">
      <div class="lab">To collect<span>రావలసినది</span></div>
      <div class="total" id="total">₹0</div>
      <div class="sub"><span><b id="cnt">0</b> customers</span><span class="od"><b id="odc">0</b> overdue</span></div>
    </section>

    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search customer · పేరు వెతకండి" aria-label="Search customer">
    </div>

    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="od" aria-pressed="false">Overdue</button>
      <button class="chip" data-f="recent" aria-pressed="false">This week</button>
      <button class="chip" id="sort" aria-label="Sort order">Sort: Amount</button>
    </div>

    <ul class="list" id="list"></ul>
  </main>

  <nav class="bar" aria-label="Main">
    <button><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg></span>Home</button>
    <button class="speak" aria-label="Speak"><span class="mic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></span>Speak</button>
    <button aria-current="page"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>More</button>
  </nav>
  <div class="gest"><i></i></div>
</div>

<script>
/* Sample data (examples). days = days since last entry; overdue when 15 or more. */
var C=[
 {n:'Ramesh',te:'రామేష్',a:4200,d:21},{n:'Lakshmi',te:'లక్ష్మి',a:1850,d:2},{n:'Venkat Rao',te:'వెంకట్ రావు',a:2300,d:18},
 {n:'Suresh',te:'సురేష్',a:950,d:5},{n:'Padma',te:'పద్మ',a:1400,d:1},{n:'Naresh',te:'నరేష్',a:800,d:9},
 {n:'Anitha',te:'అనిత',a:550,d:3},{n:'Kiran',te:'కిరణ్',a:400,d:12}];
var filt='all',byAmt=true,q='';
function inr(v){return '₹'+v.toLocaleString('en-IN')}
function when(d){return d===1?'Yesterday':d+' days ago'}
document.getElementById('total').textContent=inr(C.reduce(function(s,c){return s+c.a},0));
document.getElementById('cnt').textContent=C.length;
document.getElementById('odc').textContent=C.filter(function(c){return c.d>=15}).length;
function render(){
  var r=C.filter(function(c){
    if(filt==='od'&&c.d<15)return false; if(filt==='recent'&&c.d>7)return false;
    var s=q.toLowerCase();return !s||c.n.toLowerCase().indexOf(s)>-1||c.te.indexOf(q)>-1});
  r.sort(function(a,b){return byAmt?b.a-a.a:a.d-b.d});
  var ul=document.getElementById('list');ul.textContent='';
  if(!r.length){var e=document.createElement('li');e.className='empty';e.textContent='No customers match.';ul.appendChild(e);return}
  r.forEach(function(c){
    var od=c.d>=15,li=document.createElement('li');li.className='row'+(od?' od':'');
    li.innerHTML='<span class="av"></span><div class="body"><div class="n"></div><div class="s"></div></div><div class="amt"></div>';
    li.querySelector('.av').textContent=c.n[0];
    var n=li.querySelector('.n');n.textContent=c.n;var t=document.createElement('span');t.textContent=c.te;n.appendChild(t);
    li.querySelector('.s').textContent=od?'Overdue · last entry '+c.d+' days ago':'Last entry '+when(c.d);
    li.querySelector('.amt').textContent=inr(c.a);ul.appendChild(li)});
}
document.querySelectorAll('.chip[data-f]').forEach(function(b){b.addEventListener('click',function(){
  filt=b.dataset.f;document.querySelectorAll('.chip[data-f]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});render()})});
document.getElementById('sort').addEventListener('click',function(){byAmt=!byAmt;this.textContent='Sort: '+(byAmt?'Amount':'Recent');render()});
document.getElementById('q').addEventListener('input',function(){q=this.value.trim();render()});
render();
</script>

</body></html>
