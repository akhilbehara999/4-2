<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LOG Items Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Telugu:wght@400;500;700&display=swap">
<style>
/* Layout: Android (Material 3) list screen for every item the shop sells. Back + title bar, count line, search, unit chips, alphabetical list with price and red level, extended Add item button, bottom sheet to add or edit including spoken names for the voice parser. */
:root{
  --bg:#E4EAE9; --surface:#F9FBFB; --container:#EDF2F1; --fg:#141E1C; --muted:#5C6D69; --line:#DAE3E1; --outline:#8A9B97;
  --accent:#0B6E5F; --accent-tonal:#D3ECE6; --on-accent:#FFFFFF; --red:#B3261E; --purple:#7A3FB0;
  --inv:#2B3532; --on-inv:#F1F6F4; --scrim:rgba(0,0,0,.4);
  --f:'Roboto','Noto Sans Telugu',system-ui,sans-serif; --te:'Noto Sans Telugu','Roboto',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070C0B; --surface:#0E1715; --container:#16221F; --fg:#E3EDEA; --muted:#93A6A1; --line:#26352F; --outline:#5F746E;
  --accent:#4FD1B8; --accent-tonal:#15403A; --on-accent:#04201A; --red:#FFB4AB; --purple:#D5AEF5;
  --inv:#DDE7E4; --on-inv:#141E1C; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070C0B; --surface:#0E1715; --container:#16221F; --fg:#E3EDEA; --muted:#93A6A1; --line:#26352F; --outline:#5F746E;
  --accent:#4FD1B8; --accent-tonal:#15403A; --on-accent:#04201A; --red:#FFB4AB; --purple:#D5AEF5;
  --inv:#DDE7E4; --on-inv:#141E1C; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.4 var(--f);padding-inline:16px;padding-block:28px;display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:392px;height:820px;background:var(--surface);border-radius:32px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.sys{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 0;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.sys span:last-child{display:flex;gap:6px;align-items:center}
.top{display:flex;align-items:center;gap:4px;padding:10px 8px 4px}
.top h1{margin:0;font:500 22px/1.2 var(--f)}
.top h1 span{font:400 15px var(--te);color:var(--muted);margin-left:8px}
.ib{width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--container)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{padding:4px 16px 0}
.search{position:relative}
.search svg{position:absolute;left:16px;top:16px;color:var(--muted)}
.search input{width:100%;height:56px;border-radius:28px;border:0;background:var(--container);color:var(--fg);padding:0 20px 0 48px;font:400 16px var(--f)}
.search input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--fg);font:500 14px var(--f);cursor:pointer;white-space:nowrap;flex:none}
.chip[aria-pressed=true]{background:var(--accent-tonal);border-color:transparent;color:var(--accent)}
.count{padding:10px 20px 2px;font:400 13px var(--f);color:var(--muted)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:0 16px 96px}
.list{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;cursor:pointer;border-radius:12px}
.row:hover{background:var(--container)}
.ic{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--purple) 15%,transparent);color:var(--purple);display:grid;place-items:center;flex:none}
.body{flex:1;min-width:0}
.n{font:500 16px var(--f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n span{font:400 14px var(--te);color:var(--muted);margin-left:6px}
.s{font:400 13px var(--f);color:var(--muted);font-variant-numeric:tabular-nums}
.r{text-align:right;flex:none}
.r b{display:block;font:700 16px var(--f);font-variant-numeric:tabular-nums}
.r small{font:400 12px var(--f);color:var(--muted)}
.empty{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
.fab{position:absolute;right:16px;bottom:116px;height:56px;padding:0 20px 0 16px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);font:500 16px var(--f);display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:3}
.bar{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;background:var(--container);padding:10px 12px 8px}
.bar>button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font:500 12px var(--f);cursor:pointer;min-height:56px;justify-content:center}
.pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.bar [aria-current=page]{color:var(--fg)}
.bar [aria-current=page] .pill{background:var(--accent-tonal);color:var(--accent)}
.speak{margin-top:-34px;color:var(--fg)!important}
.speak .mic{width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 0 0 6px var(--container),0 6px 14px rgba(0,0,0,.25)}
.gest{background:var(--container);padding:2px 0 8px;display:flex;justify-content:center}
.gest i{width:110px;height:4px;border-radius:2px;background:var(--fg);opacity:.5}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:28px 28px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;z-index:6;max-height:92%;overflow-y:auto;visibility:hidden}
.show .scrim{opacity:1;pointer-events:auto}
.show .sheet{transform:none;visibility:visible}
.grab{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:0 auto 14px;opacity:.6}
.sheet h3{margin:0 0 14px;font:500 20px var(--f)}
.sheet h3 span{font:400 15px var(--te);color:var(--muted);margin-left:8px}
.fld{margin-bottom:14px}
.fld label{display:block;font:500 13px var(--f);color:var(--muted);margin:0 0 6px 4px}
.in{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--outline);background:var(--surface);color:var(--fg);padding:0 16px;font:400 17px var(--te)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.in.bad{border-color:var(--red)}
.msg{font:400 13px var(--f);color:var(--red);margin:-6px 4px 12px}
.row2{display:flex;gap:10px}.row2 .fld{flex:1;min-width:0}
.units{display:flex;gap:6px;height:56px}
.units button{flex:1;border-radius:14px;border:1.5px solid var(--outline);background:none;color:var(--fg);font:500 15px var(--f);cursor:pointer;min-width:0}
.units button[aria-pressed=true]{background:var(--accent-tonal);border-color:var(--accent);color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tag{display:flex;align-items:center;gap:4px;height:36px;padding:0 6px 0 14px;border-radius:10px;border:1px solid var(--line);font:400 15px var(--te)}
.tag button{width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.addrow{display:flex;gap:8px}.addrow .in{height:44px;font-size:15px}
.btn{height:52px;border-radius:26px;border:1px solid var(--outline);background:none;color:var(--accent);font:500 16px var(--f);cursor:pointer}
.btn.fill{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.addrow .btn{height:44px;padding:0 16px;font-size:15px;flex:none}
.srow{display:flex;gap:10px;margin-top:6px}.srow .btn{flex:1}.srow .btn.fill{flex:2}
.help{font:400 13px var(--f);color:var(--muted);margin:0 4px 6px}
.danger{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.dbtn{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:none;color:var(--red);font:500 14px var(--f);cursor:pointer}
.dbtn.yes{background:var(--red);border-color:var(--red);color:var(--surface)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 14px var(--f);color:var(--red)}
.toast{position:absolute;left:16px;right:16px;bottom:184px;background:var(--inv);color:var(--on-inv);border-radius:14px;padding:14px 16px;font:400 15px var(--f);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:440px){body{padding:0}.app{border-radius:0;border:0;height:100dvh;min-height:680px}}
</style>

<div class="app" id="app">
  <div class="sys"><span>9:41</span><span aria-hidden="true">
    <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor"><path d="M12 3C7.5 3 3.6 4.7 0.5 7.5L12 18 23.5 7.5C20.4 4.7 16.5 3 12 3z"/></svg>
    <svg width="16" height="12" viewBox="0 0 24 18" fill="currentColor"><path d="M0 18h24V0z"/></svg>
    <svg width="22" height="12" viewBox="0 0 28 14" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="23" height="12" rx="3"/><rect x="3" y="3" width="15" height="8" rx="1.5" fill="currentColor" stroke="none"/></svg>
  </span></div>

  <div class="top">
    <button class="ib" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <h1>Items<span>వస్తువులు</span></h1>
  </div>

  <div class="tools">
    <div class="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search item · వస్తువు వెతకండి" aria-label="Search items">
    </div>
    <div class="chips" id="chips" role="group" aria-label="Unit"></div>
  </div>
  <div class="count" id="count"></div>

  <div class="scroll"><ul class="list" id="list"></ul></div>

  <button class="fab" id="fab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add item</button>

  <nav class="bar" aria-label="Main">
    <button><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg></span>Home</button>
    <button class="speak" aria-label="Speak"><span class="mic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></span>Speak</button>
    <button aria-current="page"><span class="pill"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></span>More</button>
  </nav>
  <div class="gest"><i></i></div>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-label="Item">
    <div class="grab"></div>
    <h3 id="sh">Add item<span>కొత్త వస్తువు</span></h3>
    <div class="fld"><label for="fN">Name</label><input class="in" id="fN" autocomplete="off" placeholder="e.g. Rice"></div>
    <div class="msg" id="fMsg" hidden></div>
    <div class="fld"><label for="fT">Name in Telugu · తెలుగులో పేరు</label><input class="in" id="fT" autocomplete="off" placeholder="బియ్యం"></div>
    <div class="fld"><label>Other spoken names · ఇతర పేర్లు</label>
      <div class="tags" id="tags"></div>
      <div class="addrow"><input class="in" id="fA" placeholder="Add a spelling, e.g. biyyam" autocomplete="off"><button class="btn" id="fAdd" type="button">Add</button></div>
      <p class="help">Add every way you say it. The voice parser matches these.</p></div>
    <div class="fld"><label id="ul">Unit</label><div class="units" id="units" role="group" aria-labelledby="ul"></div></div>
    <div class="row2">
      <div class="fld"><label for="fR">Turns red at</label><input class="in" id="fR" inputmode="decimal" autocomplete="off"></div>
      <div class="fld"><label for="fP">Price per unit (₹)</label><input class="in" id="fP" inputmode="numeric" autocomplete="off"></div>
    </div>
    <div class="srow"><button class="btn" id="fCancel" type="button">Cancel</button><button class="btn fill" id="fSave" type="button">Save</button></div>
    <div class="danger" id="danger"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
/* Sample data (examples). */
var I=[
 {n:'Rice',te:'బియ్యం',u:'kg',p:60,r:5,t:['biyyam','rice','బియ్యం']},
 {n:'Toor dal',te:'కందిపప్పు',u:'kg',p:96,r:3,t:['kandipappu','pappu']},
 {n:'Cooking oil',te:'నూనె',u:'L',p:140,r:3,t:['nune','oil','నూనె']},
 {n:'Sugar',te:'చక్కెర',u:'kg',p:60,r:6,t:['chakkera','sugar']},
 {n:'Wheat flour',te:'గోధుమ పిండి',u:'kg',p:42,r:6,t:['godhuma pindi','atta']},
 {n:'Salt',te:'ఉప్పు',u:'kg',p:22,r:5,t:['uppu','salt']},
 {n:'Tea powder',te:'టీ పొడి',u:'kg',p:350,r:1,t:['tea','chai','teapodi']},
 {n:'Chilli powder',te:'కారం',u:'kg',p:320,r:1,t:['karam','chilli']},
 {n:'Soap',te:'సబ్బు',u:'pcs',p:35,r:10,t:['sabbu','soap']}];
var flt='all',q='',edit=null,eu='kg',et=[];
var $=function(i){return document.getElementById(i)};
function inr(v){return '₹'+v.toLocaleString('en-IN')}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}
[['all','All'],['kg','kg'],['L','Litres'],['pcs','Pieces']].forEach(function(x){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=x[1];b.setAttribute('aria-pressed',x[0]===flt);
  b.addEventListener('click',function(){flt=x[0];$('chips').querySelectorAll('.chip').forEach(function(y){y.setAttribute('aria-pressed',y===b)});render()});$('chips').appendChild(b)});
var BOX='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/></svg>';
function render(){
  var s=q.toLowerCase(),r=I.filter(function(i){return (flt==='all'||i.u===flt)&&(!s||i.n.toLowerCase().indexOf(s)>-1||i.te.indexOf(q)>-1||i.t.some(function(t){return t.toLowerCase().indexOf(s)>-1}))});
  r.sort(function(a,b){return a.n.localeCompare(b.n)});$('count').textContent=I.length+' items';
  var ul=$('list');ul.textContent='';if(!r.length){var e=document.createElement('li');e.className='empty';e.textContent='No items match.';ul.appendChild(e);return}
  r.forEach(function(i){var li=document.createElement('li'),b=document.createElement('button');b.type='button';b.className='row';
    b.innerHTML='<span class="ic">'+BOX+'</span><span class="body"><div class="n"></div><div class="s"></div></span><span class="r"><b></b><small></small></span>';
    var n=b.querySelector('.n');n.textContent=i.n;var t=document.createElement('span');t.textContent=i.te;n.appendChild(t);
    b.querySelector('.s').textContent='Turns red at '+i.r+' '+i.u;b.querySelector('b').textContent=inr(i.p)+'/'+i.u;b.querySelector('small').textContent=i.t.length+' spoken names';
    b.addEventListener('click',function(){open(i)});li.appendChild(b);ul.appendChild(li)})}
function tagsR(){var t=$('tags');t.textContent='';et.forEach(function(x,k){var d=document.createElement('span');d.className='tag';d.appendChild(document.createTextNode(x));var b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Remove '+x);
  b.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';b.addEventListener('click',function(){et.splice(k,1);tagsR()});d.appendChild(b);t.appendChild(d)})}
function unitsR(){var u=$('units');u.textContent='';['kg','L','pcs'].forEach(function(x){var b=document.createElement('button');b.type='button';b.textContent=x;b.setAttribute('aria-pressed',x===eu);b.addEventListener('click',function(){eu=x;unitsR()});u.appendChild(b)})}
$('fAdd').addEventListener('click',function(){var v=$('fA').value.trim();if(v&&et.indexOf(v)<0){et.push(v);tagsR()}$('fA').value='';$('fA').focus()});
$('fA').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('fAdd').click()}});
function err(m){$('fMsg').hidden=!m;$('fMsg').textContent=m;$('fN').classList.toggle('bad',!!m)}
function open(i){edit=i;$('sh').firstChild.nodeValue=i?'Edit item':'Add item';$('sh').querySelector('span').textContent=i?'మార్చు':'కొత్త వస్తువు';
  $('fN').value=i?i.n:'';$('fT').value=i?i.te:'';$('fR').value=i?i.r:'';$('fP').value=i?i.p:'';eu=i?i.u:'kg';et=i?i.t.slice():[];err('');tagsR();unitsR();dIdle();$('danger').hidden=!i;$('app').classList.add('show');$('fN').focus()}
function close(){$('app').classList.remove('show')}
$('fab').addEventListener('click',function(){open(null)});$('scrim').addEventListener('click',close);$('fCancel').addEventListener('click',close);$('fN').addEventListener('input',function(){err('')});
$('fSave').addEventListener('click',function(){var n=$('fN').value.trim();if(!n){err('Enter a name.');return}
  if(I.some(function(i){return i!==edit&&i.n.toLowerCase()===n.toLowerCase()})){err('An item named '+n+' already exists.');return}
  var d={n:n,te:$('fT').value.trim(),u:eu,p:parseInt($('fP').value,10)||0,r:parseFloat($('fR').value)||0,t:et.slice()};
  if(edit){Object.assign(edit,d);toast('Item updated · మార్చబడింది')}else{I.push(d);toast(n+' added · చేర్చబడింది')}close();render()});
function dIdle(){var d=$('danger');d.textContent='';var b=document.createElement('button');b.type='button';b.className='dbtn';b.textContent='Delete item';b.addEventListener('click',dAsk);d.appendChild(b)}
function dAsk(){var d=$('danger');d.textContent='';var w=document.createElement('div');w.className='confirm';w.innerHTML='<span>Delete item and its history?</span>';
  var c=document.createElement('button');c.type='button';c.className='dbtn';c.style.color='var(--fg)';c.textContent='Cancel';c.addEventListener('click',dIdle);
  var y=document.createElement('button');y.type='button';y.className='dbtn yes';y.textContent='Delete';y.addEventListener('click',function(){I.splice(I.indexOf(edit),1);close();render();toast('Item deleted')});
  w.appendChild(c);w.appendChild(y);d.appendChild(w)}
$('q').addEventListener('input',function(){q=this.value.trim();render()});
render();
</script>

</body></html>
